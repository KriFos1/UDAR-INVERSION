# Benchmark-2 (3D model with faults, 899 logging points), 3D inversion at every point.
# The default section, points 332-481 (x 1650-2400 ft), crosses the first fault.
# The solver tolerance follows the misfit of the current model: 3e-3 while chi2/n is above 12,
# 1e-3 below. The response of a MAP model at 1e-3 differs from the one at 1e-6 by about
# 0.01 standard deviations.
# Run from this folder:  UDARINV_FWD3D=/path/to/build/fwd3D udarinv run config.toml

[run]
dimension = 3
start = 332
stop = 482
output = "runs/chain"

[data]
path = "../../data/udar-benchmarks/Benchmark-2"
outputs = "outputs_3D"
floors = { USDP = 0.5, USDA = 0.25 }        # degrees, dB

[solver]
binary = "$UDARINV_FWD3D"
launcher = "local"
threads = 8

[search]
tolerance_schedule = [[12.0, 3e-3], [0.0, 1e-3]]
tolerance_retries = 3
